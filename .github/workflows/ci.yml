name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android build, tests, lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :shared:testAndroidHostTest

      - name: Lint
        run: ./gradlew :androidApp:lintDebug

      - name: Debug and minified release build
        run: ./gradlew :androidApp:assembleDebug :androidApp:assembleRelease

      - name: Room schema is committed
        run: |
          changes="$(git status --porcelain -- shared/schemas)"
          if [ -n "$changes" ]; then
            echo "::error::The Room schema changed but the exported JSON is not committed. Bump the database version, add a migration and commit shared/schemas."
            echo "$changes"
            exit 1
          fi

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-reports
          path: |
            shared/build/reports
            androidApp/build/reports

  ios:
    name: iOS compile and tests
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Common tests on the iOS simulator
        run: ./gradlew :shared:iosSimulatorArm64Test

      - name: Link the iOS framework
        run: ./gradlew :shared:linkDebugFrameworkIosArm64
