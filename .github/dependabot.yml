version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "com.google.devtools.ksp*"
      androidx:
        patterns:
          - "androidx.*"
          - "org.jetbrains.androidx.*"
          - "com.android.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
